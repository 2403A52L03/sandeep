name: Smart Agriculture CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    name: Test, Validate and Containerize
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_agri_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # --- Backend Validation & Testing ---
      - name: 3. Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 4. Initialize Database Schema & Seed Data
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: smart_agri_db
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smart_agri_db
          JWT_SECRET: test_ci_cd_secret_sr_university_2026
        run: npm run db:init

      - name: 5. Run Backend Unit & Integration Tests (Jest)
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: smart_agri_db
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smart_agri_db
          JWT_SECRET: test_ci_cd_secret_sr_university_2026
        run: npm test

      # --- Frontend Validation & Build ---
      - name: 6. Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 7. Build Frontend Production Bundle (Vite)
        working-directory: ./frontend
        env:
          VITE_API_URL: /api
        run: npm run build

      # --- Docker Container Build Verification ---
      - name: 8. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 9. Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: smart-agri-backend:latest,smart-agri-backend:${{ github.sha }}

      - name: 10. Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: smart-agri-frontend:latest,smart-agri-frontend:${{ github.sha }}

      - name: 11. Pipeline Success Verification
        run: echo "CI/CD Pipeline executed successfully across backend tests, frontend compilation, and container builds."

