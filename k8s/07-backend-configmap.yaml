apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-configmap
  namespace: smart-agri
data:
  PORT: "5000"
  NODE_ENV: "production"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
